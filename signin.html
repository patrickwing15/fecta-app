<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fecta Sign In</title>

  <style>
    :root {
      --bg: #05080c;
      --surface: #0b131c;
      --line: #203443;
      --text: #f8fbff;
      --muted: #92a6b5;
      --blue: #1ea8ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background:
        radial-gradient(circle at 80% 10%, rgba(30,168,255,.12), transparent 25%),
        linear-gradient(180deg, #030507, #081019);
      font-family: Arial, sans-serif;
      color: var(--text);
    }

    .card {
      width: min(460px, 100%);
      padding: 30px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 22px;
    }

    .logo {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: .14em;
    }

    .logo span {
      color: var(--blue);
    }

    h1 {
      font-size: 36px;
      margin: 24px 0 8px;
      letter-spacing: -.03em;
    }

    p {
      color: var(--muted);
      line-height: 1.5;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 7px 0;
      border-radius: 11px;
      border: 1px solid #294155;
      background: #060b10;
      color: white;
    }

    .btn {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border-radius: 11px;
      border: 0;
      font-weight: 800;
      cursor: pointer;
    }

    .primary {
      background: var(--blue);
      color: #00131f;
    }

    .secondary {
      background: #121d27;
      color: white;
      border: 1px solid #294155;
    }

    .or {
      text-align: center;
      color: var(--muted);
      margin: 15px 0;
    }

    .message {
      min-height: 22px;
      margin-top: 12px;
      color: #ffb6b6;
      font-size: 14px;
    }

    .small {
      font-size: 12px;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="logo">FEC<span>TA</span></div>

    <h1>Welcome to Fecta</h1>

    <p>
      Sign in to continue your personal path,
      learning, and community journey.
    </p>

    <button class="btn secondary" id="googleButton">
      Continue with Google
    </button>

    <div class="or">or</div>

    <input
      id="name"
      type="text"
      placeholder="Name — new accounts"
      autocomplete="name"
    />

    <input
      id="email"
      type="email"
      placeholder="Email"
      autocomplete="email"
    />

    <input
      id="password"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    />

    <button class="btn primary" id="signInButton">
      Sign In
    </button>

    <button class="btn secondary" id="signUpButton">
      Create Account
    </button>

    <div class="message" id="message"></div>

    <p class="small">
      Your Personal section, My Path, journal,
      and privacy choices belong to your account.
    </p>

  </main>

  <script src="./config.js"></script>

  <script type="module">

    import {
      signInWithGoogle,
      signInWithEmail,
      signUpWithEmail,
      getCurrentUser
    } from "./fecta-auth.js";

    const message = document.getElementById("message");

    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const nameInput = document.getElementById("name");

    function showMessage(text) {
      message.textContent = text || "";
    }

    document.getElementById("googleButton").onclick =
      async () => {

        try {

          showMessage("");

          const { error } =
            await signInWithGoogle();

          if (error) {
            throw error;
          }

        } catch (error) {

          showMessage(error.message);

        }

      };

    document.getElementById("signInButton").onclick =
      async () => {

        try {

          showMessage("");

          const email = emailInput.value.trim();
          const password = passwordInput.value;

          if (!email || !password) {
            throw new Error(
              "Enter your email and password."
            );
          }

          const { error } =
            await signInWithEmail(
              email,
              password
            );

          if (error) {
            throw error;
          }

          window.location.href =
            "./member.html";

        } catch (error) {

          showMessage(error.message);

        }

      };

    document.getElementById("signUpButton").onclick =
      async () => {

        try {

          showMessage("");

          const email = emailInput.value.trim();
          const password = passwordInput.value;
          const fullName = nameInput.value.trim();

          if (!email || !password) {
            throw new Error(
              "Enter an email and password."
            );
          }

          const { data, error } =
            await signUpWithEmail(
              email,
              password,
              fullName
            );

          if (error) {
            throw error;
          }

          if (data.session) {

            window.location.href =
              "./onboarding.html";

          } else {

            showMessage(
              "Account created. Check your email to confirm your account."
            );

          }

        } catch (error) {

          showMessage(error.message);

        }

      };

    const existingUser =
      await getCurrentUser().catch(() => null);

    if (existingUser) {
      window.location.href =
        "./member.html";
    }

  </script>

</body>
</html>
